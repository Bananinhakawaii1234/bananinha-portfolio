<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Roblox development portfolio of Bananinha">
    <title>Bananinha | Roblox Developer</title>
    <style>
        :root { --yellow:#ffd500; --dark-yellow:#d5ae00; --ink:#171712; --muted:#68685f; --paper:#fffef8; --section:#f2f1e9; --line:#deddd1; }
        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
        a { color:inherit; text-decoration:none; }
        .shell { width:min(1160px,calc(100% - 48px)); margin:0 auto; }
        h1 span { color:var(--dark-yellow); }
        .hero { min-height:610px; padding:120px 0 90px; }
        h1 { max-width:920px; margin:26px 0; font-size:clamp(52px,7.5vw,100px); line-height:.94; letter-spacing:-.065em; }
        .introduction { max-width:600px; color:var(--muted); font-size:19px; line-height:1.65; }
        .hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:36px; }
        .button { min-height:52px; display:inline-flex; align-items:center; justify-content:center; padding:0 24px; border:2px solid var(--ink); font-size:13px; font-weight:800; }
        .primary-button { background:var(--yellow); transition:background-color .2s; }
        .primary-button:hover { background:var(--dark-yellow); }
        .discord { background:transparent; }
        .work { padding:100px 0 110px; background:var(--section); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
        h2 { margin:0 0 45px; font-size:clamp(38px,5vw,60px); letter-spacing:-.055em; }
        .project { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr); background:var(--paper); border:1px solid var(--line); }
        .video { position:relative; aspect-ratio:16/9; background:var(--ink); }
        .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
        .project-information { display:flex; flex-direction:column; justify-content:center; padding:42px; }
        .project-information h3 { margin:0 0 16px; font-size:30px; letter-spacing:-.035em; }
        .project-information p { margin:0; color:var(--muted); font-size:15px; line-height:1.75; }
        @media (max-width:800px) { .project { grid-template-columns:1fr; } }
        @media (max-width:560px) {
            .shell { width:calc(100% - 30px); }
            .hero { min-height:auto; padding:85px 0 75px; }
            .introduction { font-size:17px; }
            .work { padding:75px 0; }
            .project-information { padding:28px; }
            .discord { width:100%; }
        }
    </style>
</head>
<body>
    <header class="hero shell" id="top">
        <h1><span>Bananinha.</span></h1>
        <p class="introduction">A Roblox developer creating gameplay systems, interfaces, and game scripts in Luau.</p>
        <div class="hero-actions">
            <a class="button primary-button" href="#work">View my work ↓</a>
            <span class="button discord">Discord · bananinha.1234</span>
        </div>
    </header>
    <section class="work" id="work">
        <div class="shell">
            <h2>Selected work</h2>
            <article class="project">
                <div class="video">
                    <iframe src="https://www.youtube.com/embed/s-_vHIz_eEA" title="Basic Potion System showcase" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
                <div class="project-information">
                    <h3>Basic Potion System</h3>
                    <p>A complete brewing system that allows players to create potions with a multitude of different effects.</p>
                </div>
            </article>
        </div>
    </section>
</body>
</html>
